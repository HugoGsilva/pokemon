[package]
name = "pokegrid-server"
version = "1.0.0"
description = "PokeGrid Remoto: as 4 contas num Chromium headless na VPS, vistas e controladas pelo navegador"
authors = ["Hugo"]
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
# Cliente do protocolo DevTools do Chromium (só os poucos métodos usados, sem crate gerado)
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
# Token do cookie de sessão (o Safari do iOS não manda o Basic auth no WebSocket)
getrandom = "0.3"
# Catálogo público do jogo (preços de NPC e nomes das hunts)
ureq = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
